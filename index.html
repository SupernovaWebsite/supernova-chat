
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Supernova — Enter Your Universe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars"></div>

  <header class="topbar">
    <a class="logo" href="#">✦ SUPERNOVA</a>
    <span class="status"><span class="dot"></span> YOUR UNIVERSE</span>
  </header>

  <main class="hero">
    <div class="planet">✦</div>
    <p class="eyebrow">A NEW UNIVERSE AWAITS</p>
    <h1>Find your <span>people.</span></h1>
    <p class="subtitle">
      One universe. Infinite conversations.<br>
      Welcome to Supernova.
    </p>

    <section class="auth-card">
      <div class="tabs">
        <button class="tab active" id="loginTab" type="button">
          Sign In
        </button>
        <button class="tab" id="signupTab" type="button">
          Sign Up
        </button>
      </div>

      <form id="authForm">
        <label for="username">Username</label>
        <input id="username" name="username"
          placeholder="Enter your username"
          autocomplete="username" required
          minlength="3" maxlength="20">

        <label for="password">Password</label>
        <input id="password" name="password"
          type="password" placeholder="Enter your password"
          autocomplete="current-password" required
          minlength="8">

        <button class="primary-btn" id="submitBtn" type="submit">
          Enter Supernova ↗
        </button>
        <p id="authMessage" class="message" aria-live="polite"></p>
      </form>
      <p class="fine-print">Your next conversation starts here.</p>
    </section>
  </main>

  <footer>SUPERNOVA © 2026 · EXPLORE YOUR UNIVERSE</footer>

  <script type="module" src="script.js"></script>
</body>
</html>
